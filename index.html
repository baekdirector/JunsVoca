<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1F6F6B" />
    <meta name="description" content="영어 단어와 숙어를 입력해 단어장을 만들고, 스펠링·뜻 쓰기 퀴즈로 학습하는 앱" />
    <!-- 링크 공유(카카오톡 등) 미리보기. og:image는 절대 주소여야 한다. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="JunsVoca" />
    <meta property="og:title" content="JunsVoca - 초등 영어 단어 테스트" />
    <meta property="og:description" content="단어장을 만들고, 시험 보고, 틀린 단어는 오답 노트로 복습해요." />
    <meta property="og:image" content="https://junsvoca.onrender.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="JunsVoca" />
    <title>JunsVoca</title>
    <!-- 폰트는 화면 표시를 막지 않도록 비동기로 불러온다 (로딩 전에는 시스템 글꼴, 끝나면 교체). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Noto+Sans+KR:wght@400;500;700;800&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Noto+Sans+KR:wght@400;500;700;800&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
